name: Generate data.json

on:
  schedule:
    # Hourly. GitHub explicitly warns scheduled workflows can be delayed or
    # dropped near the top of the hour (highest load across all of Actions) —
    # :34 avoids that window, unlike the original :07.
    - cron: "34 * * * *"
  workflow_dispatch: {}

permissions:
  contents: write # needed to commit docs/data.json back to this repo

# Prevents a manual "Run workflow" from racing a concurrent scheduled tick's
# git push to docs/data.json — queue behind it instead of running alongside.
concurrency:
  group: generate-data
  cancel-in-progress: false

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - run: npm run generate
        env:
          SUG_API_KEY: ${{ secrets.SUG_API_KEY }}
          OUTPUT_PATH: docs/data.json

      - run: npm run validate -- docs/data.json

      - name: Commit data.json
        run: |
          set -euo pipefail
          git config user.name "bps-volunteer-backend bot"
          git config user.email "actions@users.noreply.github.com"
          git add docs/data.json
          git diff --cached --quiet && exit 0
          git commit -m "chore: update data.json [skip ci]"
          git push
