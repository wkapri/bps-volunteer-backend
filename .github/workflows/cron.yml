name: Generate data.json

on:
  schedule:
    - cron: "7 * * * *" # hourly, off the top of the hour
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - run: npm run generate
        env:
          SUG_API_KEY: ${{ secrets.SUG_API_KEY }}
          OUTPUT_PATH: dist/data.json

      - run: npm run validate

      - name: Publish to bps-volunteer-data
        env:
          GH_TOKEN: ${{ secrets.DATA_REPO_TOKEN }}
          DATA_REPO: ${{ vars.DATA_REPO || 'wkapri/bps-volunteer-data' }}
        run: |
          set -euo pipefail
          git clone --depth 1 "https://x-access-token:${GH_TOKEN}@github.com/${DATA_REPO}.git" data-repo
          cp dist/data.json data-repo/data.json
          cd data-repo
          git config user.name "bps-volunteer-backend bot"
          git config user.email "actions@users.noreply.github.com"
          git add data.json
          git diff --cached --quiet && exit 0
          git commit -m "chore: update data.json [skip ci]"
          git push
